name: Build iOS IPA (CI)

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner label"
        required: false
        default: "macos-13"
      tag:
        description: "Artifact name suffix"
        required: false
        default: "fix"
  # 无人值守重试：每 10 分钟自动试一次，抢到 macOS 机器就出包
  schedule:
    - cron: "*/10 * * * *"

jobs:
  ios:
    name: iOS Build (IPA)
    runs-on: ${{ inputs.runner || 'macos-13' }}
    permissions:
      contents: write
    env:
      APPLE_DEVELOPMENT_TEAM: "ABCDE12345"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Read version
        id: ver
        shell: bash
        run: |
          V="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "building $V on ${{ inputs.runner || 'macos-13' }}"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ios-build-${{ inputs.runner || 'macos-13' }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Init iOS Xcode project
        run: |
          pnpm tauri ios init --ci
          for plist in $(find src-tauri/gen/apple -name "Info.plist" 2>/dev/null); do
            for key in "UISupportedInterfaceOrientations" "UISupportedInterfaceOrientations~iphone" "UISupportedInterfaceOrientations~ipad"; do
              /usr/libexec/PlistBuddy -c "Delete :${key}" "$plist" 2>/dev/null || true
              /usr/libexec/PlistBuddy -c "Add :${key} array" "$plist"
              /usr/libexec/PlistBuddy -c "Add :${key}:0 string UIInterfaceOrientationPortrait" "$plist"
              /usr/libexec/PlistBuddy -c "Add :${key}:1 string UIInterfaceOrientationLandscapeLeft" "$plist"
              /usr/libexec/PlistBuddy -c "Add :${key}:2 string UIInterfaceOrientationLandscapeRight" "$plist"
            done
            /usr/libexec/PlistBuddy -c "Delete :NSAppTransportSecurity" "$plist" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$plist"
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$plist"
          done
        env:
          APPLE_DEVELOPMENT_TEAM: "ABCDE12345"

      - name: Build and package IPA
        shell: bash
        env:
          APP_VERSION: ${{ steps.ver.outputs.version }}
        run: bash scripts/build-ios-unsigned.sh "$APP_VERSION"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: HGhub-iOS-IPA-${{ inputs.tag || 'scheduled' }}
          path: artifacts/*
          if-no-files-found: error

      - name: Publish IPA to Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="${{ steps.ver.outputs.version }}"
          TAG="v${V}-fix"
          NOTES="HGhub ${V} iOS 修复版（未签名 ipa）\n\n- 修复「我的」页空状态未居中导致的下半屏空白\n- 用 Sideloadly / 轻松签 自签安装"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/*.ipa --clobber
          else
            gh release create "$TAG" artifacts/*.ipa --title "HGhub ${V} iOS 修复版" --notes "$NOTES" --latest
          fi
